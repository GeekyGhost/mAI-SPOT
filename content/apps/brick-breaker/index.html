<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brick Breaker</title>
<style>html,body{margin:0;height:100%;background:#04060b;overflow:hidden;user-select:none;touch-action:none}canvas{display:block;margin:auto}</style>
</head><body><canvas id="c"></canvas>
<script src="arcade-kit.js"></script>
<script>
const VW = 800, VH = 600, cv = document.getElementById('c'), g = cv.getContext('2d');
let scale = 1;
function fit() { scale = Math.min(innerWidth / VW, innerHeight / VH); cv.width = VW * scale; cv.height = VH * scale; cv.style.marginTop = (innerHeight - cv.height) / 2 + 'px'; }
addEventListener('resize', fit); fit();
const COLS = ['#ff2e6e', '#f9993c', '#ffcf33', '#39ff88', '#2ee8f7', '#b26bff'];
let paddle, balls, bricks, drops, parts, score, lives, level, state = 'title', best = 0, mouseX = null, keys = {}, wideT = 0, slowT = 0, shake = 0;
Arcade.onBest(b => best = b);

function buildLevel(n) {
  bricks = [];
  const rows = Math.min(9, 4 + n), cols = 12, bw = 60, bh = 22, ox = (VW - cols * bw) / 2;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const pattern = n % 3 === 1 ? (r + c) % 2 === 0 : n % 3 === 2 ? Math.abs(c - 5.5) < r * 0.8 + 1 : true;
    if (!pattern) continue;
    const hp = r < n - 2 ? 2 : 1;
    bricks.push({ x: ox + c * bw + 2, y: 70 + r * bh + 2, w: bw - 4, h: bh - 4, hp, col: COLS[r % COLS.length] });
  }
}
function newBall(stuck = true) { return { x: paddle.x, y: paddle.y - 12, vx: 0, vy: 0, r: 7, stuck }; }
function reset() { score = 0; lives = 3; level = 1; startLevel(); state = 'play'; }
function startLevel() { paddle = { x: VW / 2, y: VH - 40, w: 110, h: 14 }; buildLevel(level); balls = [newBall()]; drops = []; parts = []; wideT = slowT = 0; }
function launch() { balls.forEach(b => { if (b.stuck) { b.stuck = false; const a = -Math.PI / 2 + (Math.random() - .5) * .6; const sp = 6 + level * .4; b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp; Arcade.sfx('blip'); } }); }
function burst(x, y, col, n = 12) { for (let i = 0; i < n; i++) parts.push({ x, y, vx: (Math.random() - .5) * 7, vy: (Math.random() - .5) * 7, l: 28, col }); }

function update() {
  const pw = wideT > 0 ? 170 : 110; paddle.w += (pw - paddle.w) * .2; wideT--; slowT--;
  if (mouseX !== null) paddle.x += (mouseX - paddle.x) * .5;
  if (keys.ArrowLeft || keys.a) paddle.x -= 10; if (keys.ArrowRight || keys.d) paddle.x += 10;
  paddle.x = Math.max(paddle.w / 2, Math.min(VW - paddle.w / 2, paddle.x));
  const k = slowT > 0 ? .6 : 1;
  for (const b of balls) {
    if (b.stuck) { b.x = paddle.x; b.y = paddle.y - 12; continue; }
    const steps = 3;
    for (let s = 0; s < steps; s++) {
      b.x += b.vx * k / steps; b.y += b.vy * k / steps;
      if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); Arcade.sfx('blip'); }
      if (b.x > VW - b.r) { b.x = VW - b.r; b.vx = -Math.abs(b.vx); Arcade.sfx('blip'); }
      if (b.y < b.r + 40) { b.y = b.r + 40; b.vy = Math.abs(b.vy); }
      if (b.vy > 0 && b.y + b.r > paddle.y - paddle.h / 2 && b.y < paddle.y + paddle.h && Math.abs(b.x - paddle.x) < paddle.w / 2 + b.r) {
        const hit = (b.x - paddle.x) / (paddle.w / 2), sp = Math.hypot(b.vx, b.vy) * 1.01, a = -Math.PI / 2 + hit * 1.05;
        b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp; b.y = paddle.y - paddle.h / 2 - b.r; Arcade.sfx('hit');
      }
      for (const br of bricks) {
        if (br.hp <= 0) continue;
        if (b.x + b.r > br.x && b.x - b.r < br.x + br.w && b.y + b.r > br.y && b.y - b.r < br.y + br.h) {
          const ox = Math.min(b.x + b.r - br.x, br.x + br.w - (b.x - b.r)), oy = Math.min(b.y + b.r - br.y, br.y + br.h - (b.y - b.r));
          if (ox < oy) b.vx = -b.vx; else b.vy = -b.vy;
          br.hp--; score += 10 * level; Arcade.sfx(br.hp ? 'hit' : 'pick');
          if (br.hp <= 0) { burst(br.x + br.w / 2, br.y + br.h / 2, br.col); shake = 5; if (Math.random() < .14) drops.push({ x: br.x + br.w / 2, y: br.y, t: ['wide', 'multi', 'slow', 'life'][Math.random() * 4 | 0] }); }
          break;
        }
      }
    }
  }
  balls = balls.filter(b => b.y < VH + 20);
  if (!balls.length) {
    lives--; Arcade.sfx('lose'); shake = 12;
    if (lives <= 0) { state = 'over'; Arcade.score(score); } else balls = [newBall()];
  }
  drops = drops.filter(d => {
    d.y += 3;
    if (d.y > paddle.y - 10 && d.y < paddle.y + 10 && Math.abs(d.x - paddle.x) < paddle.w / 2) {
      Arcade.sfx('win');
      if (d.t === 'wide') wideT = 900; if (d.t === 'slow') slowT = 600; if (d.t === 'life') lives = Math.min(6, lives + 1);
      if (d.t === 'multi') { const src = balls.find(b => !b.stuck) || balls[0]; for (const a of [-.5, .5]) { const sp = Math.hypot(src.vx, src.vy) || 6; const ang = Math.atan2(src.vy || -1, src.vx) + a; balls.push({ x: src.x, y: src.y, r: 7, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, stuck: false }); } }
      return false;
    }
    return d.y < VH;
  });
  if (bricks.every(b => b.hp <= 0)) { level++; score += 500; Arcade.sfx('win'); startLevel(); }
}
function draw() {
  g.setTransform(scale, 0, 0, scale, 0, 0);
  const sx = shake > 0 ? (Math.random() - .5) * shake : 0, sy = shake > 0 ? (Math.random() - .5) * shake : 0; shake *= .85;
  g.translate(sx, sy);
  const grd = g.createLinearGradient(0, 0, 0, VH); grd.addColorStop(0, '#0b0f20'); grd.addColorStop(1, '#04060b'); g.fillStyle = grd; g.fillRect(-20, -20, VW + 40, VH + 40);
  g.fillStyle = '#fff'; g.font = '700 18px ui-monospace,monospace'; g.textAlign = 'left';
  g.fillText(`SCORE ${score ?? 0}`, 20, 28); g.textAlign = 'center'; g.fillText(`LEVEL ${level ?? 1}`, VW / 2, 28); g.textAlign = 'right'; g.fillText(`BEST ${Math.max(best, score || 0)}   ${'♥'.repeat(Math.max(0, lives ?? 3))}`, VW - 20, 28);
  if (bricks) for (const b of bricks) if (b.hp > 0) {
    g.shadowBlur = 12; g.shadowColor = b.col; g.fillStyle = b.col; g.globalAlpha = b.hp > 1 ? 1 : .85; g.fillRect(b.x, b.y, b.w, b.h);
    if (b.hp > 1) { g.strokeStyle = '#fff'; g.lineWidth = 2; g.strokeRect(b.x + 2, b.y + 2, b.w - 4, b.h - 4); }
    g.globalAlpha = 1;
  }
  g.shadowBlur = 0;
  if (paddle) { g.shadowBlur = 20; g.shadowColor = '#2ee8f7'; g.fillStyle = wideT > 0 ? '#ffcf33' : '#2ee8f7'; g.beginPath(); g.roundRect(paddle.x - paddle.w / 2, paddle.y - paddle.h / 2, paddle.w, paddle.h, 7); g.fill(); }
  if (balls) for (const b of balls) { g.shadowBlur = 16; g.shadowColor = '#fff'; g.fillStyle = slowT > 0 ? '#9be7ff' : '#fff'; g.beginPath(); g.arc(b.x, b.y, b.r, 0, 7); g.fill(); }
  g.shadowBlur = 0;
  if (drops) for (const d of drops) { const c = { wide: '#ffcf33', multi: '#b26bff', slow: '#2ee8f7', life: '#ff2e6e' }[d.t]; g.fillStyle = c; g.beginPath(); g.roundRect(d.x - 18, d.y - 9, 36, 18, 9); g.fill(); g.fillStyle = '#000'; g.font = '800 11px system-ui'; g.textAlign = 'center'; g.fillText({ wide: 'W', multi: '×3', slow: 'S', life: '♥' }[d.t], d.x, d.y + 4); }
  if (parts) parts = parts.filter(p => { p.x += p.vx; p.y += p.vy; p.vy += .2; g.globalAlpha = p.l / 28; g.fillStyle = p.col; g.fillRect(p.x, p.y, 4, 4); g.globalAlpha = 1; return --p.l > 0; });
  if (state === 'play' && balls?.some(b => b.stuck)) { g.fillStyle = '#ffffffaa'; g.font = '600 16px system-ui'; g.textAlign = 'center'; g.fillText('Click / Space to launch', VW / 2, VH - 80); }
  if (state !== 'play') {
    g.fillStyle = 'rgba(4,6,11,.8)'; g.fillRect(0, 0, VW, VH); g.textAlign = 'center';
    g.shadowBlur = 24; g.shadowColor = '#ff2e6e'; g.fillStyle = '#ff2e6e'; g.font = '900 64px system-ui'; g.fillText(state === 'over' ? 'GAME OVER' : 'BRICK BREAKER', VW / 2, 250); g.shadowBlur = 0;
    g.fillStyle = '#fff'; g.font = '600 20px system-ui'; if (state === 'over') g.fillText(`Score ${score}  ·  reached level ${level}`, VW / 2, 300);
    g.fillText('Click / Space to play', VW / 2, 345);
    g.fillStyle = '#9aa'; g.font = '500 15px system-ui'; g.fillText('Mouse or ←/→ to move  ·  catch power-ups: W wide · ×3 multi-ball · S slow · ♥ life', VW / 2, 390);
  }
}
function loop() { if (state === 'play') update(); draw(); requestAnimationFrame(loop); }
cv.addEventListener('mousemove', e => { const r = cv.getBoundingClientRect(); mouseX = (e.clientX - r.left) / scale; });
cv.addEventListener('touchmove', e => { const r = cv.getBoundingClientRect(); mouseX = (e.touches[0].clientX - r.left) / scale; e.preventDefault(); }, { passive: false });
const go = () => { if (state !== 'play') reset(); else launch(); };
cv.addEventListener('mousedown', go); cv.addEventListener('touchstart', e => { const r = cv.getBoundingClientRect(); mouseX = (e.touches[0].clientX - r.left) / scale; go(); }, { passive: true });
addEventListener('keydown', e => { keys[e.key] = true; if (e.key === ' ') { e.preventDefault(); go(); } });
addEventListener('keyup', e => keys[e.key] = false);
loop();
</script></body></html>
