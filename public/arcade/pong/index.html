<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Neon Paddle Showdown</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #080a10;
      color: #ff9900;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    #gameCanvas {
      background: #0c101a;
      border: 2px solid #ff9900;
      box-shadow: 0 0 25px rgba(255, 153, 0, 0.35);
      border-radius: 4px;
      display: block;
    }
    #hud {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-weight: bold;
      font-size: 14px;
      text-shadow: 0 0 8px #ff9900;
    }
    #instructions {
      position: absolute;
      bottom: 12px;
      font-size: 11px;
      color: #b58038;
      letter-spacing: 1px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div>PLAYER: <span id="pScore">0</span> | PEER AI: <span id="aiScore">0</span></div>
    <div>NEON PADDLE SHOWDOWN [SANDBOXED ARCADE]</div>
  </div>
  <canvas id="gameCanvas" width="760" height="480"></canvas>
  <div id="instructions">CONTROLS: [UP / DOWN] or [W / S] Move Paddle • First to 7 Wins</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const pScoreEl = document.getElementById('pScore');
    const aiScoreEl = document.getElementById('aiScore');

    let pScore = 0;
    let aiScore = 0;
    let gameOver = false;
    let winner = '';

    const paddleW = 12;
    const paddleH = 75;
    let playerY = canvas.height / 2 - paddleH / 2;
    let aiY = canvas.height / 2 - paddleH / 2;
    let playerSpeed = 7;
    let aiSpeed = 4.8;

    let ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      vx: 6,
      vy: 3,
      r: 7
    };

    let trail = [];

    // Web Audio Synthesizer
    let audioCtx = null;
    function playBeep(freq, duration = 0.06) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const keys = {};
    window.addEventListener('keydown', e => {
      if (['ArrowUp', 'ArrowDown', 'KeyW', 'KeyS', 'Space'].includes(e.code)) {
        e.preventDefault();
      }
      keys[e.code] = true;

      if (e.code === 'Escape') {
        e.preventDefault();
        try {
          window.parent.postMessage({ type: 'ARCADE_ESC' }, '*');
        } catch (err) {}
      }

      if (gameOver && e.code === 'KeyR') {
        pScore = 0;
        aiScore = 0;
        pScoreEl.textContent = 0;
        aiScoreEl.textContent = 0;
        gameOver = false;
        resetBall(1);
      }
    });
    window.addEventListener('keyup', e => {
      if (['ArrowUp', 'ArrowDown', 'KeyW', 'KeyS', 'Space'].includes(e.code)) {
        e.preventDefault();
      }
      keys[e.code] = false;
    });

    function resetBall(direction = 1) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.vx = (Math.random() > 0.5 ? 5.5 : -5.5) * direction;
      ball.vy = (Math.random() - 0.5) * 6;
      trail = [];
    }

    function update() {
      if (gameOver) return;

      // Player Movement
      if ((keys['ArrowUp'] || keys['KeyW']) && playerY > 5) playerY -= playerSpeed;
      if ((keys['ArrowDown'] || keys['KeyS']) && playerY < canvas.height - paddleH - 5) playerY += playerSpeed;

      // AI Movement (Simple tracking with error)
      const aiTarget = ball.y - paddleH / 2;
      if (aiY < aiTarget - 6) aiY += aiSpeed;
      else if (aiY > aiTarget + 6) aiY -= aiSpeed;
      aiY = Math.max(5, Math.min(canvas.height - paddleH - 5, aiY));

      // Ball Update & Trail
      trail.push({ x: ball.x, y: ball.y });
      if (trail.length > 8) trail.shift();

      ball.x += ball.vx;
      ball.y += ball.vy;

      // Wall Bounce (Top/Bottom)
      if (ball.y - ball.r <= 0 || ball.y + ball.r >= canvas.height) {
        ball.vy = -ball.vy;
        playBeep(440);
      }

      // Left Paddle Collision (Player)
      if (ball.x - ball.r <= 25 + paddleW && ball.x + ball.r >= 25) {
        if (ball.y >= playerY && ball.y <= playerY + paddleH) {
          ball.vx = Math.abs(ball.vx) * 1.05;
          const hitOffset = (ball.y - (playerY + paddleH / 2)) / (paddleH / 2);
          ball.vy = hitOffset * 7;
          playBeep(659);
        }
      }

      // Right Paddle Collision (AI)
      if (ball.x + ball.r >= canvas.width - 25 - paddleW && ball.x - ball.r <= canvas.width - 25) {
        if (ball.y >= aiY && ball.y <= aiY + paddleH) {
          ball.vx = -Math.abs(ball.vx) * 1.05;
          const hitOffset = (ball.y - (aiY + paddleH / 2)) / (paddleH / 2);
          ball.vy = hitOffset * 7;
          playBeep(523);
        }
      }

      // Score logic
      if (ball.x < 0) {
        aiScore++;
        aiScoreEl.textContent = aiScore;
        playBeep(180, 0.2);
        if (aiScore >= 7) { gameOver = true; winner = 'PEER AI WINS'; }
        else resetBall(1);
      } else if (ball.x > canvas.width) {
        pScore++;
        pScoreEl.textContent = pScore;
        playBeep(880, 0.2);
        if (pScore >= 7) { gameOver = true; winner = 'PLAYER WINS'; }
        else resetBall(-1);
      }
    }

    function render() {
      ctx.fillStyle = '#0c101a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center Divider line
      ctx.strokeStyle = 'rgba(255, 153, 0, 0.25)';
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Ball Trail
      for (let i = 0; i < trail.length; i++) {
        const t = trail[i];
        ctx.fillStyle = `rgba(255, 153, 0, ${i / trail.length * 0.4})`;
        ctx.beginPath();
        ctx.arc(t.x, t.y, ball.r * (i / trail.length), 0, Math.PI * 2);
        ctx.fill();
      }

      // Ball
      ctx.fillStyle = '#ffcc00';
      ctx.shadowColor = '#ff9900';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();

      // Left Paddle (Player - Cyan Glow)
      ctx.fillStyle = '#00ffcc';
      ctx.shadowColor = '#00ffcc';
      ctx.shadowBlur = 15;
      ctx.fillRect(25, playerY, paddleW, paddleH);

      // Right Paddle (AI - Orange Glow)
      ctx.fillStyle = '#ff6600';
      ctx.shadowColor = '#ff6600';
      ctx.shadowBlur = 15;
      ctx.fillRect(canvas.width - 25 - paddleW, aiY, paddleW, paddleH);

      // Game Over Screen
      if (gameOver) {
        ctx.fillStyle = 'rgba(10, 14, 22, 0.88)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = winner === 'PLAYER WINS' ? '#00ffcc' : '#ff3366';
        ctx.font = 'bold 36px Courier New';
        ctx.textAlign = 'center';
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 15;
        ctx.fillText(winner, canvas.width / 2, canvas.height / 2 - 15);
        ctx.fillStyle = '#ff9900';
        ctx.font = '16px Courier New';
        ctx.shadowColor = '#ff9900';
        ctx.shadowBlur = 8;
        ctx.fillText('PRESS [R] TO PLAY AGAIN', canvas.width / 2, canvas.height / 2 + 30);
      }
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
